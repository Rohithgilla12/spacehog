[package]
name = "spacehog-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
rmcp = { version = "3.9.0", features = ["server", "transport-io"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
spacehog-core = { version = "0.1.0", path = "../core" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std", "time"] }
tracing = "0.1.44"
