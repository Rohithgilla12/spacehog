[package]
name = "spacehog"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Find the hog. Feed it to your agent."

[lints]
workspace = true

[[bin]]
name = "spacehog"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"
spacehog-core = { version = "0.1.0", path = "../core" }
spacehog-mcp = { version = "0.1.0", path = "../mcp" }
spacehog-tui = { version = "0.1.0", path = "../tui" }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
