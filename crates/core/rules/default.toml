# spacehog default rules.
#
# Rules are evaluated top-down for every directory and every file not already
# inside a claimed subtree. The first rule whose matchers all hold claims the
# node. A claim stops descent unless the rule sets `fallback = true`, in which
# case deeper rules may still carve out nested claims.
#
# Matchers (all that are present must hold; values inside one matcher are OR):
#   name     globs against the node name
#   path     globs against the absolute path; `~` and `$VAR` are expanded,
#            `*` stays within one path component, `**` crosses components
#   ext      file extensions, case-insensitive
#   kind     "dir" (default), "file", or "any"; `ext` implies "file"
#   sibling  globs; one must exist next to the node
#   contains globs; one must exist directly inside the node
#
# stale = "project" measures staleness from the owning project (the parent
# dir, its manifest files, and .git/HEAD); "self" uses the newest mtime in the
# subtree; "none" never reports staleness.

