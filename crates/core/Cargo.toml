[package]
name = "spacehog-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
dirs = "7.0.0"
globset = "0.4.21"
humansize = "2.1.3"
jwalk = "0.9.0"
libc = "0.2.191"
rayon = "1.12.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
toml = "1.2.0"
tracing = "0.1.44"
trash = "5.3.0"

[dev-dependencies]
tempfile = "3.27.0"
